<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJ ICE</title>
    <!-- Fuentes Minimalistas y Modernas -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&family=Syncopate:wght@700&display=swap" rel="stylesheet">
    
    <style>
        /* === VARIABLES Y DISEÑO BASE === */
        :root {
            --bg-color: #050914; /* Azul/Negro muy profundo */
            --surface-color: #0a1122;
            --accent-ice: #00f0ff;
            --accent-glow: rgba(0, 240, 255, 0.3);
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
            --price-green: #00ff73;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent; /* Quita el destello azul en móviles */
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* === PANTALLA DE BIENVENIDA === */
        #welcome-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: rgba(5, 9, 20, 0.95);
            backdrop-filter: blur(10px);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        #welcome-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .welcome-title {
            font-size: 2rem;
            margin-bottom: 2rem;
            text-align: center;
            font-weight: 300;
            animation: fadeInDown 0.8s ease-out;
        }

        .welcome-options {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            justify-content: center;
            animation: fadeInUp 0.8s ease-out;
        }

        .welcome-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--accent-ice);
            color: var(--accent-ice);
            padding: 15px 30px;
            font-size: 1.1rem;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .welcome-btn:hover {
            background: var(--accent-ice);
            color: var(--bg-color);
            box-shadow: 0 0 20px var(--accent-glow);
            transform: scale(1.05);
        }

        .welcome-all {
            margin-top: 2rem;
            color: var(--text-muted);
            text-decoration: underline;
            cursor: pointer;
            font-size: 0.9rem;
            transition: color 0.3s;
            animation: fadeInUp 1s ease-out;
        }

        .welcome-all:hover { color: var(--text-main); }

        /* === CABECERA === */
        header {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            position: relative;
        }

        h1.logo {
            font-family: 'Syncopate', sans-serif;
            font-size: 2.5rem;
            letter-spacing: 4px;
            color: #fff;
            text-shadow: 0 0 15px var(--accent-glow);
            margin: 0;
        }

        /* Menú Hamburguesa / Categorías */
        .menu-toggle {
            position: absolute;
            right: 20px;
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.8rem;
            cursor: pointer;
            transition: transform 0.3s;
        }
        
        .menu-toggle:hover { transform: scale(1.1); color: var(--accent-ice); }

        .categories-menu {
            position: absolute;
            top: 70px;
            right: 20px;
            background: rgba(10, 17, 34, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .categories-menu.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .cat-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 10px 20px;
            text-align: left;
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .cat-btn:hover, .cat-btn.active {
            background: rgba(0, 240, 255, 0.1);
            color: var(--accent-ice);
        }

        /* === CONTROLES INFERIORES A LA LÍNEA === */
        .tools-bar {
            display: flex;
            justify-content: center;
            padding: 15px 20px;
        }

        .sort-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .sort-btn:hover {
            border-color: var(--accent-ice);
            color: var(--accent-ice);
        }

        /* === GRILLA DE PRODUCTOS === */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 30px;
            padding: 20px 40px 60px;
            max-width: 1300px;
            margin: 0 auto;
        }

        .product-card {
            background-color: var(--surface-color);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255,255,255,0.02);
            position: relative;
            overflow: hidden;
        }

        .product-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, transparent, rgba(0, 240, 255, 0.05));
            opacity: 0;
            transition: opacity 0.4s;
        }

        .product-card:hover, .product-card:active {
            transform: translateY(-8px) scale(1.02);
            border-color: rgba(0, 240, 255, 0.3);
            box-shadow: 0 15px 30px rgba(0,0,0,0.4), 0 0 15px var(--accent-glow);
        }

        .product-card:hover::before { opacity: 1; }

        .img-container {
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            border-radius: 8px;
            overflow: hidden;
        }

        .product-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.3s;
        }

        .product-title {
            font-weight: 500;
            font-size: 1.1rem;
            margin-bottom: 8px;
            color: #fff;
            position: relative;
        }

        .product-price {
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: 300;
        }

        /* === MODAL & GALERÍA HORIZONTAL === */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: var(--surface-color);
            width: 90%;
            max-width: 450px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            /* Animación agradable de salto */
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            color: #fff;
            font-size: 1.8rem;
            cursor: pointer;
            z-index: 10;
            background: rgba(0,0,0,0.5);
            width: 35px; height: 35px;
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            transition: background 0.3s;
        }

        .close-btn:hover { background: rgba(255,255,255,0.2); }

        #modal-title {
            text-align: center;
            padding: 20px;
            font-weight: 500;
            font-size: 1.4rem;
        }

        /* Galería estilo teléfono deslizable */
        .gallery-wrapper {
            position: relative;
            width: 100%;
            height: 350px;
            background: #000;
        }

        .slider {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            width: 100%;
            height: 100%;
            -ms-overflow-style: none; /* Oculta scrollbar IE */
            scrollbar-width: none; /* Oculta scrollbar Firefox */
        }
        
        .slider::-webkit-scrollbar { display: none; } /* Oculta scrollbar Chrome */

        .slider img {
            width: 100%;
            height: 100%;
            flex-shrink: 0;
            scroll-snap-align: center;
            object-fit: contain;
        }

        /* Botones de navegación de galería (para PC) */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.1);
            color: white;
            border: none;
            width: 40px; height: 40px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 5;
            font-size: 1.2rem;
            transition: background 0.3s;
        }
        .nav-btn:hover { background: rgba(255,255,255,0.3); }
        .nav-prev { left: 10px; }
        .nav-next { right: 10px; }

        .swipe-hint {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 10px;
        }

        .modal-footer {
            padding: 20px;
            text-align: center;
            background: linear-gradient(0deg, #050914 0%, transparent 100%);
        }

        /* Animación atractiva para el precio */
        .price-glow {
            color: var(--price-green);
            font-size: 2rem;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(0, 255, 115, 0.4);
            margin-bottom: 15px;
            animation: breathe 2s infinite ease-in-out;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); text-shadow: 0 0 10px rgba(0, 255, 115, 0.4); }
            50% { transform: scale(1.05); text-shadow: 0 0 20px rgba(0, 255, 115, 0.8); }
        }

        .wp-btn {
            display: inline-block;
            background: linear-gradient(45deg, #25D366, #128C7E);
            color: white;
            text-decoration: none;
            width: 100%;
            font-size: 1.1rem;
            font-weight: 500;
            padding: 15px;
            border-radius: 12px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
        }

        .wp-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.6);
        }

        /* Animaciones base */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>

        // === PANTALLA DE BIENVENIDA ===
        function selectInterest(category) {
            document.getElementById('welcome-screen').classList.add('hidden');
            currentCategory = category;
            updateMenuSelection();
            renderProducts();
        }

        // === MENÚ DE CATEGORÍAS (Hamburguesa) ===
        function toggleMenu() {
            document.getElementById('category-menu').classList.toggle('active');
        }

        document.querySelectorAll('.cat-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                currentCategory = e.target.getAttribute('data-cat');
                updateMenuSelection();
                renderProducts();
                toggleMenu(); // Cierra el menú al seleccionar
            });
        });

        function updateMenuSelection() {
            document.querySelectorAll('.cat-btn').forEach(b => {
                b.classList.remove('active');
                if(b.getAttribute('data-cat') === currentCategory) b.classList.add('active');
            });
        }

        // === ORDENAR ===
        document.getElementById('sort-btn').addEventListener('click', (e) => {
            sortDesc = !sortDesc;
            e.target.textContent = sortDesc ? 'Ordenar: Mayor Precio ▼' : 'Ordenar: Menor Precio ▲';
            renderProducts();
        });

        // === RENDERIZAR PRODUCTOS ===
        function renderProducts() {
            grid.innerHTML = '';
            let filtered = products.filter(p => currentCategory === 'Todos' || p.category === currentCategory);
            filtered.sort((a, b) => sortDesc ? b.price - a.price : a.price - b.price);

            filtered.forEach((product, index) => {
                const card = document.createElement('div');
                card.className = 'product-card';
                
                const firstImage = product.folder + product.images[0];
                const imgId = `img-${index}`;

                card.innerHTML = `
                    <div class="img-container">
                        <img id="${imgId}" src="${firstImage}" alt="${product.name}" class="product-image" loading="lazy">
                    </div>
                    <h3 class="product-title">${product.name}</h3>
                    <p class="product-price">${formatter.format(product.price)}</p>
                `;
                
                // Lógica de transición de fotos al pasar el mouse o dedo
                const startCycle = () => {
                    let imgIndex = 0;
                    const imgEl = document.getElementById(imgId);
                    hoverIntervals[imgId] = setInterval(() => {
                        imgIndex = (imgIndex + 1) % product.images.length;
                        imgEl.src = product.folder + product.images[imgIndex];
                    }, 800); // Cambia foto cada 0.8s
                };

                const stopCycle = () => {
                    clearInterval(hoverIntervals[imgId]);
                    document.getElementById(imgId).src = firstImage; // Vuelve a la original
                };

                // Eventos PC
                card.addEventListener('mouseenter', startCycle);
                card.addEventListener('mouseleave', stopCycle);
                
                // Eventos Móvil (Touch)
                card.addEventListener('touchstart', startCycle, {passive: true});
                card.addEventListener('touchend', stopCycle);
                card.addEventListener('touchcancel', stopCycle);

                // Clic para abrir (Prevenir que un touch abra de inmediato si solo hace scroll)
                card.addEventListener('click', () => openModal(product));
                grid.appendChild(card);
            });
        }

        // === MODAL Y GALERÍA HORIZONTAL ===
        function openModal(product) {
            document.getElementById('modal-title').textContent = product.name;
            document.getElementById('modal-price').textContent = formatter.format(product.price);
            
            const wsMensaje = encodeURIComponent(`Hola, me interesa el ${product.name}`);
            document.getElementById('modal-whatsapp').href = `https://wa.me/573143766181?text=${wsMensaje}`;

            // Cargar imágenes horizontalmente
            modalSlider.innerHTML = '';
            product.images.forEach(imgName => {
                const img = document.createElement('img');
                img.src = product.folder + imgName;
                img.alt = `Vista de ${product.name}`;
                img.loading = 'lazy';
                modalSlider.appendChild(img);
            });

            document.getElementById('product-modal').style.display = 'flex';
            modalSlider.scrollLeft = 0; // Reiniciar posición
        }

        function closeModal() {
            document.getElementById('product-modal').style.display = 'none';
        }

        // Navegación con botones (PC)
        function scrollGallery(direction) {
            const width = modalSlider.clientWidth;
            modalSlider.scrollBy({ left: width * direction, behavior: 'smooth' });
        }

        // Cerrar modal al clickear fuera
        window.addEventListener('click', (e) => {
            const modal = document.getElementById('product-modal');
            if (e.target === modal) closeModal();
        });

        // Ocultar menú categorías si se hace click en otro lado
        window.addEventListener('click', (e) => {
            if (!e.target.matches('.menu-toggle') && !e.target.closest('.categories-menu')) {
                document.getElementById('category-menu').classList.remove('active');
            }
        });
    </script>
</body>
</html>
